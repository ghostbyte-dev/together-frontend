<ng-container *transloco="let t; prefix: 'passwordReset'">
  <h1 class="mb-8 text-center text-2xl font-semibold text-gray-900 dark:text-gray-100">{{ t('title') }}</h1>

  @if (invalidLink) {
  <p role="alert">{{ t('invalidLink') }}</p>
  } @else {
  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div class="mb-6">
      <label for="password">{{ t('passwordLabel') }}</label>
      <input type="password" id="password" formControlName="password" autocomplete="new-password"
        [placeholder]="t('passwordLabel')" class="w-full" />
    </div>

    <button type="submit" [disabled]="resetForm.invalid || loading()" class="btn-primary w-full">
      {{ t('submit') }}
    </button>

    @if (hasError()) {
    <p role="alert" class="mt-3 text-red-500">{{ t('error') }}</p>
    }
  </form>
  }
</ng-container>
