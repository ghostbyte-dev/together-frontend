<ng-container *transloco="let t; prefix: 'requestPasswordReset'">
  <h1 class="mb-8 text-center text-2xl font-semibold text-gray-900 dark:text-gray-100">{{ t('title') }}</h1>

  @if (sent()) {
  <p role="status">{{ t('sentMessage') }}</p>
  } @else {
  <form [formGroup]="emailForm" (ngSubmit)="onSubmit()">
    <div class="mb-6">
      <label for="email">{{ t('emailLabel') }}</label>
      <input type="email" id="email" formControlName="email" autocomplete="email" [placeholder]="t('emailPlaceholder')"
        class="w-full" />
    </div>

    <button type="submit" [disabled]="emailForm.invalid || loading()" class="btn-primary w-full">
      {{ t('submit') }}
    </button>

    @if (hasError()) {
    <p role="alert" class="mt-3 text-red-500">{{ t('error') }}</p>
    }
  </form>
  }
</ng-container>
